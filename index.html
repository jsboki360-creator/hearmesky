<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

html,body{
margin:0;
padding:0;
overflow:hidden;
background:black;
width:100%;
height:100%;
font-family:Arial;
}

video{
position:fixed;
top:50%;
left:50%;
min-width:100%;
min-height:100%;
transform:translate(-50%,-50%);
object-fit:cover;
z-index:0;
filter:brightness(0.7);
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
pointer-events:none;
}

#ui{

position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);

z-index:5;

width:85%;
max-width:420px;

background:rgba(0,0,0,0.45);

backdrop-filter:blur(12px);

padding:24px;

border-radius:24px;

box-shadow:
0 0 30px rgba(255,255,255,0.15);

color:white;

text-align:center;
}

h1{
margin-top:0;
font-size:36px;
}

input{

width:100%;

padding:16px;

border:none;

border-radius:14px;

font-size:20px;

margin-top:10px;

box-sizing:border-box;
}

.selects{

display:flex;

gap:10px;

margin-top:18px;
}

select{

flex:1;

padding:14px;

border:none;

border-radius:14px;

font-size:16px;
}

button{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

font-size:20px;

font-weight:bold;

background:#ff2e63;

color:white;
}

#topTitle{

position:fixed;

top:30px;
left:50%;

transform:translateX(-50%);

z-index:4;

color:white;

font-size:28px;

font-weight:bold;

text-shadow:
0 0 20px rgba(255,255,255,0.8);

display:none;
}

</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="c"></canvas>

<div id="topTitle">
HearMeSKY
</div>

<div id="ui">

<h1>HearMeSKY</h1>

<input
id="msg"
placeholder="Enter Message"
value="WE LOVE YOU">

<div class="selects">

<select id="txtsty">

<option value="drone">
Drone
</option>

</select>

<select id="effsty">

<option value="aurora">
Aurora
</option>

<option value="fireworks">
Fireworks
</option>

<option value="stars">
Stars
</option>

</select>

</div>

<button onclick="startShow()">
START EVENT
</button>

</div>

<script>

// =====================================================
// SETUP
// =====================================================

const canvas =
document.getElementById("c");

const ctx =
canvas.getContext("2d");

const video =
document.getElementById("video");

let W,H;

function resize(){

 W=innerWidth;
 H=innerHeight;

 const dpr =
 window.devicePixelRatio || 1;

 canvas.width=W*dpr;
 canvas.height=H*dpr;

 canvas.style.width=W+"px";
 canvas.style.height=H+"px";

 ctx.setTransform(
  dpr,0,0,dpr,0,0
 );
}

resize();

addEventListener(
"resize",
resize
);

// =====================================================
// STATE
// =====================================================

let started=false;

let droneParticles=[];

let sparkles=[];

let rockets=[];
let sparks=[];

let auroraTime=0;

let message="";

let effStyle="aurora";

// =====================================================
// CAMERA
// =====================================================

async function initCamera(){

 const stream =
 await navigator.mediaDevices.getUserMedia({

   video:{
     facingMode:"environment"
   },

   audio:false
 });

 video.srcObject=stream;

 await video.play();
}

// =====================================================
// START
// =====================================================

async function startShow(){

 message=
 document.getElementById("msg")
 .value
 .trim();

 effStyle=
 document.getElementById("effsty")
 .value;

 document.getElementById(
 "ui"
 ).style.display="none";

 document.getElementById(
 "topTitle"
 ).style.display="block";

 await initCamera();

 initDrone();

 started=true;

 draw();
}

// =====================================================
// DRONE
// =====================================================

function drawMultiline(
ctx,
text,
x,
y,
maxWidth,
lineHeight
){

 let words=text.split(" ");

 let line="";
 let lines=[];

 for(let w of words){

  let test=line+w+" ";

  if(
   ctx.measureText(test).width
   > maxWidth
  ){
   lines.push(line);
   line=w+" ";
  }else{
   line=test;
  }
 }

 lines.push(line);

 let startY=
 y-(lines.length*lineHeight)/2;

 lines.forEach((l,i)=>{

  ctx.fillText(
   l.trim(),
   x,
   startY+i*lineHeight
  );
 });
}

function initDrone(){

 const off =
 document.createElement("canvas");

 const o =
 off.getContext("2d");

 off.width=W;
 off.height=H;

 let size =
 Math.min(W/6,H/4);

 o.fillStyle="white";

 o.font=
 `bold ${size}px Arial`;

 o.textAlign="center";
 o.textBaseline="middle";

 drawMultiline(
  o,
  message,
  off.width/2,
  off.height/2,
  off.width*0.8,
  size*1.2
 );

 const img =
 o.getImageData(
  0,
  0,
  off.width,
  off.height
 );

 droneParticles=[];

 for(let y=0;y<off.height;y+=8){

  for(let x=0;x<off.width;x+=8){

   let i=(y*off.width+x)*4;

   if(img.data[i+3]>120){

    droneParticles.push({

      x:Math.random()*W,
      y:Math.random()*H,

      tx:x,
      ty:y,

      size:
      Math.random()*2+1.5,

      hue:
      180+Math.random()*80
    });
   }
  }
 }
}

function drawDrone(){

 ctx.save();

 ctx.globalCompositeOperation=
 "screen";

 droneParticles.forEach((p,i)=>{

  p.x+=(p.tx-p.x)*0.22;
  p.y+=(p.ty-p.y)*0.22;

  let flicker=
  0.7+
  Math.sin(
   Date.now()*0.01+i
  )*0.3;

  ctx.globalAlpha=flicker;

  ctx.shadowBlur=25;

  ctx.shadowColor=
  `hsl(${p.hue},100%,70%)`;

  ctx.fillStyle=
  `hsl(${p.hue},100%,70%)`;

  ctx.beginPath();

  ctx.arc(
   p.x,
   p.y,
   p.size,
   0,
   Math.PI*2
  );

  ctx.fill();
 });

 ctx.restore();
}

// =====================================================
// AURORA
// =====================================================

function drawAurora(){

 auroraTime+=0.01;

 const t=auroraTime;

 ctx.save();

 ctx.globalCompositeOperation=
 "screen";

 ctx.globalAlpha=0.65;

 const topY=H*0.03;

 const height=H*0.5;

 for(let band=0;band<5;band++){

  ctx.beginPath();

  let baseY=
  topY+band*16;

  for(let x=0;x<=W;x+=12){

   let nx=x/W;

   let wave=

    Math.sin(
      nx*8+t+band
    )*35

    +

    Math.sin(
      nx*18+t*0.6
    )*18;

   ctx.lineTo(
    x,
    baseY+wave
   );
  }

  for(let x=W;x>=0;x-=12){

   let nx=x/W;

   let wave=

    Math.sin(
      nx*8+t+band
    )*35

    +

    Math.sin(
      nx*18+t*0.6
    )*18;

   ctx.lineTo(
    x,
    baseY+wave+height
   );
  }

  ctx.closePath();

  let g=
  ctx.createLinearGradient(
   0,
   topY,
   0,
   topY+height
  );

  if(band%2===0){

   g.addColorStop(
    0,
    "rgba(120,255,180,0.75)"
   );

   g.addColorStop(
    0.5,
    "rgba(80,180,255,0.2)"
   );

  }else{

   g.addColorStop(
    0,
    "rgba(200,120,255,0.6)"
   );

   g.addColorStop(
    0.5,
    "rgba(100,180,255,0.2)"
   );
  }

  g.addColorStop(
   1,
   "transparent"
  );

  ctx.fillStyle=g;

  ctx.filter="blur(20px)";

  ctx.fill();
 }

 ctx.restore();
}

// =====================================================
// SPARKLES
// =====================================================

function spawnSparkles(){

 for(let i=0;i<4;i++){

  sparkles.push({

   x:Math.random()*W,

   y:Math.random()*H*0.9,

   vx:(Math.random()-0.5)*0.4,

   vy:(Math.random()-0.5)*0.4,

   size:Math.random()*2+1,

   life:80+Math.random()*80,

   maxLife:160,

   hue:
   180+Math.random()*80
  });
 }
}

function drawSparkles(){

 spawnSparkles();

 ctx.save();

 ctx.globalCompositeOperation=
 "screen";

 for(
 let i=sparkles.length-1;
 i>=0;
 i--
 ){

  let s=sparkles[i];

  s.x+=s.vx;
  s.y+=s.vy;

  s.life--;

  let a=s.life/s.maxLife;

  ctx.globalAlpha=a;

  ctx.shadowBlur=20;

  ctx.shadowColor=
  `hsl(${s.hue},100%,70%)`;

  ctx.fillStyle=
  `hsla(${s.hue},100%,70%,1)`;

  ctx.beginPath();

  ctx.arc(
   s.x,
   s.y,
   s.size,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.fillRect(
   s.x-6,
   s.y,
   12,
   1
  );

  ctx.fillRect(
   s.x,
   s.y-6,
   1,
   12
  );

  if(s.life<=0){

   sparkles.splice(i,1);
  }
 }

 ctx.restore();
}

// =====================================================
// FIREWORKS
// =====================================================

function launchRocket(){

 rockets.push({

  x:Math.random()*W,

  y:H,

  vx:(Math.random()-0.5),

  vy:-(Math.random()*4+6),

  exploded:false
 });
}

setInterval(
launchRocket,
1300
);

function explode(x,y){

 const colors=[

 "#ff3b3b",
 "#ff8c42",
 "#ffd93d",
 "#ff2e63",
 "#ff66cc"
 ];

 let c=
 colors[
  Math.floor(
   Math.random()*colors.length
  )
 ];

 for(let i=0;i<90;i++){

  let a=
  Math.random()*Math.PI*2;

  let s=
  Math.random()*3+1;

  sparks.push({

   x,y,

   vx:Math.cos(a)*s,
   vy:Math.sin(a)*s,

   life:90,

   size:
   Math.random()*3+1,

   color:c
  });
 }
}

function drawFireworks(){

 rockets.forEach(r=>{

  r.x+=r.vx;
  r.y+=r.vy;

  r.vy+=0.08;

  ctx.fillStyle="#fff";

  ctx.fillRect(
   r.x,
   r.y,
   2,
   6
  );

  if(r.vy>0&&!r.exploded){

   explode(r.x,r.y);

   r.exploded=true;
  }
 });

 sparks.forEach((s,i)=>{

  s.x+=s.vx;
  s.y+=s.vy;

  s.vy+=0.03;

  s.life--;

  ctx.globalAlpha=s.life/90;

  ctx.shadowBlur=15;

  ctx.shadowColor=s.color;

  ctx.fillStyle=s.color;

  ctx.beginPath();

  ctx.arc(
   s.x,
   s.y,
   s.size,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;

  if(s.life<=0){

   sparks.splice(i,1);
  }
 });
}

// =====================================================
// DRAW
// =====================================================

function draw(){

 if(!started) return;

 ctx.clearRect(
  0,
  0,
  W,
  H
 );

 if(effStyle==="aurora"){

  drawAurora();
 }

 if(effStyle==="fireworks"){

  drawFireworks();
 }

 drawSparkles();

 drawDrone();

 requestAnimationFrame(draw);
}

</script>
</body>
</html>
