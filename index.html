<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HearMeSKY Golf</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
background:#02040a;
}

body{

background:

radial-gradient(
circle at 50% 20%,
rgba(40,80,130,.45),
transparent 35%
),

linear-gradient(
#02040a,
#07131d 60%,
#0a2416
);
}

canvas{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;
}

#ui{

position:fixed;

left:50%;
top:50%;

transform:translate(-50%,-50%);

width:85%;
max-width:420px;

padding:24px;

box-sizing:border-box;

background:rgba(0,0,0,.55);

border-radius:24px;

color:white;

text-align:center;
}

input{

width:100%;

padding:15px;

box-sizing:border-box;

border:none;

border-radius:14px;

font-size:18px;

text-align:center;
}

button{

margin-top:15px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

font-size:20px;

font-weight:bold;

background:gold;
}

</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="ui">

<h2>⛳ HearMeSKY</h2>

<input
id="msg"
value="제10회 76정회원 골프회">

<button onclick="startEvent()">
START
</button>

</div>

<script>

const canvas=
document.getElementById("c");

const ctx=
canvas.getContext("2d");

let W,H;

let started=false;

let startTime=0;

let message="";

let particles=[];

let lastBurst=0;

function resize(){

 W=innerWidth;
 H=innerHeight;

 canvas.width=W;
 canvas.height=H;
}

resize();

addEventListener(
"resize",
resize
);

function rand(a,b){

 return a+
 Math.random()*(b-a);
}

function createBurst(){

 const colors=[
  "#ffd84d",
  "#ff78c4",
  "#58b9ff"
 ];

 const fireColor=
 colors[
  Math.floor(
   Math.random()*3
  )
 ];

 const cx=
 W*0.20+
 Math.random()*W*0.60;

 const cy=
 H*0.06+
 Math.random()*H*0.12;

 for(let i=0;i<80;i++){

  let a=
  Math.random()*Math.PI*2;

  let s=
  rand(1.5,4);

  particles.push({

   x:cx,
   y:cy,

   vx:
   Math.cos(a)*s,

   vy:
   Math.sin(a)*s,

   tx:cx,
   ty:cy,

   size:
   rand(2,4),

   color:
   fireColor,

   life:120,

   maxLife:120
  });
 }
}

function startEvent(){

 message=

 document.getElementById("msg")
 .value
 .trim();

 document.getElementById(
 "ui"
 ).style.display="none";

 particles=[];

 createBurst();

 lastBurst=
 performance.now();

 startTime=
 performance.now();

 started=true;

 requestAnimationFrame(draw);
}

function drawStar(
x,
y,
r,
col,
a
){

 ctx.save();

 ctx.translate(x,y);

 ctx.globalAlpha=a;

 ctx.fillStyle=col;

 ctx.beginPath();

 for(let i=0;i<10;i++){

  let rr=
  (i%2===0)
  ? r
  : r*0.45;

  let ang=
  -Math.PI/2+
  i*Math.PI/5;

  let px=
  Math.cos(ang)*rr;

  let py=
  Math.sin(ang)*rr;

  if(i===0)
   ctx.moveTo(px,py);
  else
   ctx.lineTo(px,py);
 }

 ctx.closePath();

 ctx.fill();

 ctx.restore();
}

function drawHole(){

 const x=W/2;
 const y=H*0.07;

 ctx.fillStyle="#31b95e";

 ctx.beginPath();

 ctx.ellipse(
 x,
 y+28,
 55,
 18,
 0,
 0,
 Math.PI*2
 );

 ctx.fill();

 ctx.fillStyle="#111";

 ctx.beginPath();

 ctx.ellipse(
 x,
 y+22,
 12,
 5,
 0,
 0,
 Math.PI*2
 );

 ctx.fill();

 ctx.strokeStyle="#ffe58a";

 ctx.lineWidth=4;

 ctx.beginPath();

 ctx.moveTo(x,y+22);

 ctx.lineTo(x,y-38);

 ctx.stroke();

 ctx.fillStyle="#ff4d6d";

 ctx.beginPath();

 ctx.moveTo(x,y-38);

 ctx.lineTo(x+34,y-24);

 ctx.lineTo(x,y-10);

 ctx.closePath();

 ctx.fill();
}


function draw(now){

 if(!started)return;

 ctx.clearRect(
 0,
 0,
 W,
 H
 );

 drawHole();



 let t=
 now-startTime;

 // 골프공

 if(t<1800){

  let p=t/1800;

  let x=

  -50+

  (W/2+50)*p;

 let y=

H*0.82+

(H*0.09-H*0.82)*p

-

Math.sin(
 p*Math.PI
)*140;

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
   x,
   y,
   14,
   0,
   Math.PI*2
  );

  ctx.fill();
 }

// ============================
// 상단 랜덤 불꽃 반복
// ============================

if(now-lastBurst>2500){

    createBurst();

    lastBurst=now;
}

 // 파티클

 for(
 let i=particles.length-1;
 i>=0;
 i--
 ){

  let p=
  particles[i];
p.vy+=0.03;
  p.x+=p.vx;

  p.y+=p.vy;

  p.life--;


ctx.strokeStyle=p.color;

ctx.globalAlpha=
(p.life/p.maxLife)*0.4;

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
 p.x,
 p.y
);

ctx.lineTo(
 p.x-p.vx*6,
 p.y-p.vy*6
);

ctx.stroke();
  
  drawStar(

   p.x,

   p.y,

   p.size,

   p.color,

   p.life/120
  );

  if(p.life<=0){

   particles.splice(i,1);
  }
 }

 // 문구

if(t>2000){

    const yy = H*0.09;

    // 배너

    ctx.fillStyle =
    "rgba(0,0,0,0.35)";

    ctx.beginPath();

    ctx.roundRect(
        W*0.08,
        yy-26,
        W*0.84,
        52,
        20
    );

    ctx.fill();

    // 행사명

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.strokeStyle =
    "rgba(0,0,0,0.55)";

    ctx.lineWidth = 4;

    ctx.fillStyle =
    "#ffe06b";

    ctx.font =
    "bold 24px Arial";

    const banner =

"🏌️ 제10회 76정회원 골프회";

    ctx.strokeText(
        banner,
        W/2,
        yy
    );

    ctx.fillText(
        banner,
        W/2,
        yy
    );
}
// ============================
// 배경 반짝
// ============================

for(let i=0;i<12;i++){

  let x =

  (i*137+
   now*0.02)%W;

  let y =

  ((i*91)+
   now*0.04)%H;

  drawStar(

   x,

   y,

   2,

   ["#ffd84d",
    "#ff78c4",
    "#58b9ff"][i%3],

   0.8
  );
}
 requestAnimationFrame(draw);
}

</script>

</body>
</html>
